name: build-image

# Reconstruye la imagen arxy y la publica en el release 'latest',
# de donde 'arxy setup' la descarga (URL latest + .sha256 autoverificado).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 5'   # viernes 04:00 UTC
  push:
    # Como en AnyLinux: los .md no disparan builds (un build son ~20 min).
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Directriz AnyLinux: builds canonicos en Arch (pkgforge), nunca en
    # Fedora/otras distros (rutas lib32 distintas). --privileged: el
    # bootstrap monta proc/sys/dev para pacman+keyring.
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build bootstrap (root.x86_64)
        run: |
          chmod +x create-arch-bootstrap.sh create-arxy-image.sh
          PROFILE=arxy ./create-arch-bootstrap.sh

      - name: Pack image tarball
        run: PROFILE=arxy ./create-arxy-image.sh

      - name: Sign tarball (minisign)
        # Sin `if:` con secrets (GitHub lo rechaza: fichero invalido, 0s).
        # El gate va en shell; sin secret el publish aborta abajo igual.
        env:
          MINISIGN_SECRET: ${{ secrets.MINISIGN_SECRET }}
        run: |
          [[ -n "${MINISIGN_SECRET:-}" ]] || { echo "sin MINISIGN_SECRET: salto firma (el publish abortara)"; exit 0; }
          pacman -Sy --noconfirm --needed minisign
          printf '%s\n' "$MINISIGN_SECRET" > /tmp/arxy.sec
          chmod 600 /tmp/arxy.sec
          minisign -S -s /tmp/arxy.sec -m arxy-rootfs-x86_64.tar.zst \
            -x arxy-rootfs-x86_64.tar.zst.minisig
          shred -u /tmp/arxy.sec

      - name: Matrix (puerta de publicacion)
        # Actions mete HOME=/github/home pero el CLI escribe lanzadores en
        # el home real de root (REAL_HOME, e04a9b6): sin esto el check
        # 'export sintetico' mira en el dir equivocado. No es producto:
        # export/unexport resuelven REAL_APPS por si mismos.
        env:
          HOME: /root
        # tests/matrix.sh: 33–43 checks con assertions de contenido
        # sobre el tarball recien construido. Si falla, el release no se toca.
        run: |
          pacman -Sy --noconfirm --needed bubblewrap file
          curl -fsSL https://raw.githubusercontent.com/SrDicov/arxy/main/src/arxy -o /usr/local/bin/arxy
          chmod +x /usr/local/bin/arxy
          MATRIX_IMAGE="$PWD/arxy-rootfs-x86_64.tar.zst" MATRIX_WRITE2=1 ./tests/matrix.sh

      - name: Publish to 'latest' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pacman -Sy --noconfirm --needed github-cli git
          repo="SrDicov/arxy-image"
          tag=latest
          gh release view "$tag" -R "$repo" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$repo" --title "latest" \
              --notes "Imagen arxy actual (construida por CI). 'arxy setup' descarga de aqui."
          test -f arxy-rootfs-x86_64.tar.zst.minisig || { echo "sin .minisig: release sin firma, abortando"; exit 1; }
          gh release upload "$tag" -R "$repo" --clobber \
            arxy-rootfs-x86_64.tar.zst arxy-rootfs-x86_64.tar.zst.sha256 arxy-rootfs-x86_64.tar.zst.minisig
          gh release view "$tag" -R "$repo" --json assets --jq '.assets[].name'
