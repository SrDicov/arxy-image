name: build-image

# Reconstruye la imagen arxy y la publica en el release 'latest',
# de donde 'arxy setup' la descarga (URL latest + .sha256 autoverificado).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 5'   # viernes 04:00 UTC
  push:
    # Como en AnyLinux: los .md no disparan builds (un build son ~20 min).
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Directriz AnyLinux: builds canonicos en Arch (pkgforge), nunca en
    # Fedora/otras distros (rutas lib32 distintas). --privileged: el
    # bootstrap monta proc/sys/dev para pacman+keyring.
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build bootstrap (root.x86_64)
        run: |
          chmod +x create-arch-bootstrap.sh create-arxy-image.sh
          PROFILE=arxy ./create-arch-bootstrap.sh

      - name: Pack image tarball
        run: PROFILE=arxy ./create-arxy-image.sh

      - name: Smoke test (la imagen arranca en nivel 1 y 2)
        # Puerta de publicacion: si esto falla, el release no se toca.
        # Prueba el tarball recien construido (file://), no el publicado.
        run: |
          pacman -Sy --noconfirm --needed bubblewrap file
          curl -fsSL https://raw.githubusercontent.com/SrDicov/arxy/main/src/arxy -o /usr/local/bin/arxy
          chmod +x /usr/local/bin/arxy
          export ARXY_IMAGE_URL="file://$PWD/arxy-rootfs-x86_64.tar.zst"
          arxy setup
          arxy doctor | tee doctor.txt
          grep -q 'nivel 1' doctor.txt
          arxy run /usr/bin/true
          arxy run /usr/bin/bash --version
          arxy run /usr/bin/pacman --version | grep -q 'Pacman v'
          # Nivel 2 forzado (ld-linux + chroot, sin bwrap)
          ARXY_LEVEL=2 arxy run /usr/bin/true
          ARXY_LEVEL=2 arxy run /usr/bin/bash --version
          ARXY_LEVEL=2 arxy run /usr/bin/pacman --version | grep -q 'Pacman v'
          # Nivel 2 autodetectado (bwrap que siempre falla)
          mkdir -p /tmp/nobwrap
          printf '#!/bin/sh\nexit 1\n' > /tmp/nobwrap/bwrap
          chmod +x /tmp/nobwrap/bwrap
          PATH="/tmp/nobwrap:$PATH" arxy doctor | grep -q 'nivel 2'
          PATH="/tmp/nobwrap:$PATH" arxy run /usr/bin/true
          # Export con .desktop sintetico (bash no trae .desktop propio)
          printf '[Desktop Entry]\nType=Application\nName=Arxy Test\nExec=/usr/bin/true\n' \
            > /var/lib/arxy/root/usr/share/applications/arxy-test.desktop
          arxy export --all
          test -f /root/.local/share/applications/arxy-arxy-test.desktop
          arxy unexport arxy-test
          # Install/remove en nivel 2 (chroot) + guard de AUR en nivel 2
          ARXY_LEVEL=2 arxy install tree
          ARXY_LEVEL=2 arxy run tree --version
          ARXY_LEVEL=2 arxy remove tree
          ARXY_LEVEL=2 arxy install --aur nano 2>&1 | grep -q 'necesita nivel 1'
          echo SMOKE_OK

      - name: Publish to 'latest' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pacman -Sy --noconfirm --needed github-cli git
          repo="SrDicov/arxy-image"
          tag=latest
          gh release view "$tag" -R "$repo" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$repo" --title "latest" \
              --notes "Imagen arxy actual (construida por CI). 'arxy setup' descarga de aqui."
          gh release upload "$tag" -R "$repo" --clobber \
            arxy-rootfs-x86_64.tar.zst arxy-rootfs-x86_64.tar.zst.sha256
          gh release view "$tag" -R "$repo" --json assets --jq '.assets[].name'
